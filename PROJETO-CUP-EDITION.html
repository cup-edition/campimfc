<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=980">
<title>PROJETO CUP EDITION</title>
<link rel="icon" type="image/png" href="https://cup-edition.github.io/sistema-inscricoes/CUP%20EDITION.png">
    <meta property="og:title" content="PROJETO CUP EDITION" />
    <meta property="og:description" content="Projeto unificado Cup Edition - CAMPIM FC &amp; PES" />
    <meta property="og:image" content="https://cup-edition.github.io/campimfc/CUP%20EDITION.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://cup-edition.github.io/campimfc/PROJETO-CUP-EDITION.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CUP EDITION - CAMPIM FC &amp; PES" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PROJETO CUP EDITION" />
    <meta name="twitter:description" content="Projeto unificado Cup Edition - Campim FC &amp; PES" />
    <meta name="twitter:image" content="https://cup-edition.github.io/campimfc/CUP%20EDITION.jpg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Orbitron:wght@600;700;900&display=swap');
  :root{--bg:#05080c;--bg2:#0a1219;--card:rgba(16,28,42,0.85);--bd:rgba(56,156,255,0.15);--acc:#00d4ff;--muted:#4a6a7a;--txt:#f0f8ff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
  .topbar{background:rgba(10,18,25,0.95);border-bottom:1px solid var(--bd);padding:12px 16px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;backdrop-filter:blur(20px)}
  .brand{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:1px;font-size:16px;background:linear-gradient(135deg,#00d4ff 0%,#7b2ffc 50%,#ff6b6b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .nav{max-width:none;margin:0;padding:8px 16px;display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;white-space:nowrap;justify-content:safe center;border-bottom:1px solid var(--bd);background:linear-gradient(180deg, rgba(10,18,25,0.95), rgba(5,8,12,0.9));backdrop-filter:blur(20px);scrollbar-width:none;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
  .nav::-webkit-scrollbar{display:none}
  .tab{padding:8px 13px;font-size:10px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;color:#8ab9d1;background:rgba(22,40,62,0.88);border:1.5px solid rgba(56,156,255,0.32);border-radius:999px;cursor:pointer;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);white-space:nowrap;flex-shrink:0;backdrop-filter:blur(12px);box-shadow:0 3px 14px rgba(0,0,0,0.4), 0 0 0 1px rgba(56,156,255,0.08), inset 0 1px 0 rgba(255,255,255,0.07)}
  .tab:hover{color:#e0f2ff;border-color:rgba(0,212,255,0.55);background:linear-gradient(135deg, rgba(0,212,255,0.18), rgba(123,47,252,0.18));transform:translateY(-1px);box-shadow:0 6px 22px rgba(0,212,255,0.25), 0 0 0 1px rgba(0,212,255,0.15)}
  .tab.active{color:#fff;background:linear-gradient(135deg, #00d4ff 0%, #7b2ffc 55%, #ff3b9a 100%);border-color:transparent;box-shadow:0 6px 24px rgba(0,212,255,0.45), 0 0 0 2.5px rgba(0,212,255,0.35), inset 0 1px 0 rgba(255,255,255,0.25);transform:translateY(-1px);font-weight:800;letter-spacing:0.6px}
  .wrap{max-width:none;margin:0;padding:0}
  .pane{display:none;height:calc(100vh - 36px);background:transparent;border:none;border-radius:0;overflow:hidden;box-shadow:none}
  .pane.active{display:block}
  .pane iframe{width:100%;height:100%;border:none;background:var(--bg2);display:block}
  .hint{font-size:11px;color:var(--muted);text-align:center;margin:8px 0}
  /* hint removido a pedido do usuário */
  .mobile-hint{display:none !important}

  /* ===== HORIZONTAL EM TODOS - DESKTOP E CELULAR ===== */
  .nav{
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
    scroll-behavior:smooth;
    scroll-padding:16px;
    -webkit-mask-image:linear-gradient(to right, transparent, black 12px, black calc(100% - 12px), transparent);
            mask-image:linear-gradient(to right, transparent, black 12px, black calc(100% - 12px), transparent);
  }
  .tab{scroll-snap-align:start}

  .wrap{position:relative}
  /* ===== AJUSTES SÓ PARA CELULAR - continua horizontal arrastando ===== */
  @media (max-width:768px){
    .nav{
      display:flex;
      flex-wrap:nowrap;
      overflow-x:auto;
      overflow-y:hidden;
      gap:8px;
      padding:7px 12px;
      justify-content:flex-start;
      align-items:center;
      position:sticky;
      top:0;
      z-index:9;
      scroll-snap-type:x mandatory;
      scrollbar-width:none;
    }
    .nav::-webkit-scrollbar{display:none}
    .tab{
      white-space:nowrap;
      flex-shrink:0;
      flex:none;
      width:auto;
      max-width:none;
      min-height:auto;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      line-height:1;
      padding:10px 14px;
      font-size:10px;
      letter-spacing:0.5px;
      border-radius:999px;
      scroll-snap-align:start;
    }
    .pane{
      height:calc(100vh - 60px);
      height:calc(100dvh - 60px);
    }

  }
  @media (max-width:480px){
    .nav{gap:6px;padding:8px 10px}
    .tab{padding:9px 12px;font-size:9px}
  }
  /* ===== SPLIT VIEW (tipo Brave) - menu clique direito ===== */
  .ctx-menu{position:fixed;min-width:210px;background:#1a2332;border:1px solid rgba(0,212,255,0.25);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,0.5);padding:6px;display:none;flex-direction:column;gap:4px;z-index:9999}
  .ctx-menu.show{display:flex}
  .ctx-item{padding:10px 14px;font-size:11px;font-weight:800;letter-spacing:0.4px;text-transform:uppercase;color:var(--txt);background:transparent;border:none;border-radius:8px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;transition:all 0.15s}
  .ctx-item:hover{background:rgba(0,212,255,0.12);color:#00d4ff}
  .ctx-item.danger{color:#ff6b6b}
  .ctx-item.danger:hover{background:rgba(255,107,107,0.12)}
  .ctx-sep{height:1px;background:rgba(56,156,255,0.12);margin:2px 0}
  .tab.split-pick{outline:2px dashed #00d4ff;outline-offset:2px;animation:pulsePick 1.2s infinite}
  .tab.split-left{color:#fff !important;background:linear-gradient(135deg,#00d4ff 0%,#00a8cc 100%) !important;border-color:transparent !important;box-shadow:0 4px 16px rgba(0,212,255,0.4)}
  .tab.split-right{color:#fff !important;background:linear-gradient(135deg,#7b2ffc 0%,#5a1fcc 100%) !important;border-color:transparent !important;box-shadow:0 4px 16px rgba(123,47,252,0.4)}
  @keyframes pulsePick{0%,100%{opacity:1}50%{opacity:0.6}}
  .wrap.split{display:flex;flex-direction:row;gap:0;height:calc(100vh - 36px);overflow:hidden}
  .wrap.split .pane{display:none !important;flex:1 1 0;min-width:0;height:100% !important}
  .wrap.split .pane.split-active{display:block !important}
  .split-divider{width:3px;background:rgba(56,156,255,0.25);cursor:col-resize;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;transition:all 0.15s;user-select:none;-webkit-user-select:none}
  .split-divider::before{content:"";position:absolute;left:-6px;right:-6px;top:0;bottom:0}
  .split-divider::after{content:"";width:1px;height:28px;background:rgba(0,212,255,0.6);border-radius:999px;opacity:0.7}
  .split-divider:hover{background:rgba(0,212,255,0.5);width:4px}
  .split-divider:active{width:4px;background:#00d4ff}
  .split-divider.dragging{background:#00d4ff;width:4px}
  .split-label{position:absolute;top:8px;padding:3px 7px;font-size:9px;font-weight:800;letter-spacing:0.5px;border-radius:999px;color:#fff;pointer-events:none}
  .split-label.left{left:8px;background:rgba(0,212,255,0.9)}
  .split-label.right{right:8px;background:rgba(123,47,252,0.9)}
  @media (max-width:768px){
    .wrap.split{flex-direction:column;height:calc(100dvh - 60px)}
    .split-divider{width:100%;height:3px;cursor:row-resize}
    .split-divider::before{left:0;right:0;top:-6px;bottom:-6px}
    .split-divider::after{width:28px;height:1px}
  }
</style>
</head>
<body>

<nav class="nav" id="nav">
  <button class="tab active" data-pane="p-admin">1 ADMIN-CADASTROS</button>
  <button class="tab" data-pane="p-adm-campim">2 ADM-CUP-EDITION (CAMPIM FC)</button>
  <button class="tab" data-pane="p-adm-pes">3 ADM-CUP-EDITION (PES)</button>
  <button class="tab" data-pane="p-cup-campim">4 CUP-EDITION (CAMPIM FC)</button>
  <button class="tab" data-pane="p-cup-pes">5 CUP-EDITION (PES)</button>
  <button class="tab" data-pane="p-vip">6 INSCRIÇÃO VIP</button>
  <button class="tab" data-pane="p-gratuita">7 INSCRIÇÃO GRATUITA</button>
  <button class="tab" data-pane="p-sorteio">8 SORTEIO (CAMPIM FC)</button>
  <button class="tab" data-pane="p-saque">9 SAQUE-PIX</button>
</nav>
<div class="wrap">
  <div class="pane active" id="p-admin"><iframe src="https://cup-edition.github.io/sistema-inscricoes/ADMIN.html" loading="lazy" title="ADMIN"></iframe></div>
  <div class="pane" id="p-adm-campim"><iframe src="https://cup-edition.github.io/campimfc/ADM-CUP-EDITION.html" loading="lazy" title="ADM CAMPIM"></iframe></div>
  <div class="pane" id="p-adm-pes"><iframe src="https://cup-edition.github.io/campimfc/ADM-CUP-EDITION-PES.html" loading="lazy" title="ADM PES"></iframe></div>
  <div class="pane" id="p-cup-campim"><iframe src="https://cup-edition.github.io/campimfc/CUP-EDITION.html" loading="lazy" title="CUP CAMPIM"></iframe></div>
  <div class="pane" id="p-cup-pes"><iframe src="https://cup-edition.github.io/campimfc/CUP-EDITION-PES.html" loading="lazy" title="CUP PES"></iframe></div>
  <div class="pane" id="p-vip"><iframe src="https://cup-edition.github.io/sistema-inscricoes/INSCREVER.html" loading="lazy" title="INSCRICAO VIP"></iframe></div>
  <div class="pane" id="p-gratuita"><iframe src="https://cup-edition.github.io/sistema-inscricoes/INSCRICAO-GRATUITA.html" loading="lazy" title="GRATUITA"></iframe></div>
  <div class="pane" id="p-sorteio"><iframe src="https://cup-edition.github.io/sorteio-nomes/SORTEIO.html" loading="lazy" title="SORTEIO"></iframe></div>
  <div class="pane" id="p-saque"><iframe src="https://cup-edition.github.io/sistema-inscricoes/SAQUE-PIX.html" loading="lazy" title="SAQUE"></iframe></div>
</div>
<div id="ctxMenu" class="ctx-menu" role="menu">
  <button class="ctx-item" id="ctxSplit" role="menuitem">⊞ Dividir com esta aba</button>
  <button class="ctx-item" id="ctxSplitOther" role="menuitem" style="display:none">⇄ Escolher 2ª aba...</button>
  <div class="ctx-sep" id="ctxSep" style="display:none"></div>
  <button class="ctx-item danger" id="ctxCloseSplit" role="menuitem" style="display:none">✕ Fechar divisão</button>
</div>
<script>
  const tabs=document.querySelectorAll('.tab');
  const panes=document.querySelectorAll('.pane');
  const nav=document.getElementById('nav');
  function reloadPane(id){ const pane=document.getElementById(id); if(!pane) return; const f=pane.querySelector('iframe'); if(f) f.src=f.src; }
  function isMobile(){ return window.innerWidth<=768; }
  function centerActiveTab(tab){
    if(!tab || !nav) return;
    tab.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  }
  // ===== SPLIT VIEW LOGIC (clique direito na aba) =====
  let splitSelecting=false, splitLeft=null, splitRight=null;
  let ctxTarget=null;
  const wrapEl2=document.querySelector('.wrap');
  const ctxMenu=document.getElementById('ctxMenu');
  const ctxSplit=document.getElementById('ctxSplit');
  const ctxCloseSplit=document.getElementById('ctxCloseSplit');
  const ctxSep=document.getElementById('ctxSep');
  function updateSplitPickUI(){
    tabs.forEach(t=>{ t.classList.remove('split-pick','split-left','split-right'); });
    if(!splitSelecting) return;
    if(!splitLeft) tabs.forEach(t=> t.classList.add('split-pick'));
    else if(splitLeft && !splitRight){
      tabs.forEach(t=>{
        if(t.dataset.pane===splitLeft) t.classList.add('split-left');
        else t.classList.add('split-pick');
      });
    }
  }
  function enterSplitSelect(initialLeft){
    exitSplit();
    splitSelecting=true;
    splitLeft=initialLeft||null; splitRight=null;
    updateSplitPickUI();
    // dica visual no cursor
    if(splitLeft) ctxSplit.textContent='⇄ Agora clique na 2ª aba...';
  }
  function exitSplitSelect(){
    splitSelecting=false;
    tabs.forEach(t=> t.classList.remove('split-pick','split-left','split-right'));
    ctxSplit.textContent='⊞ Dividir com esta aba';
  }
  function enterSplit(leftId,rightId){
    splitSelecting=false;
    splitLeft=leftId; splitRight=rightId;
    hideCtx();
    // garante que IDs existem
    if(!document.getElementById(leftId) || !document.getElementById(rightId)) return;
    tabs.forEach(t=> t.classList.remove('split-pick','split-left','split-right','active'));
    document.querySelectorAll('.pane').forEach(p=>{ p.classList.remove('active','split-active'); p.style.order=''; p.style.flex=''; p.style.display=''; });
    // marca as duas abas
    const tL=document.querySelector(`.tab[data-pane="${leftId}"]`);
    const tR=document.querySelector(`.tab[data-pane="${rightId}"]`);
    if(tL) tL.classList.add('split-left');
    if(tR) tR.classList.add('split-right');
    // ativa os dois panes - garante que ambos fiquem visíveis (com !important)
    const pL=document.getElementById(leftId), pR=document.getElementById(rightId);
    if(!pL || !pR) return;
    pL.classList.add('split-active'); pR.classList.add('split-active');
    pL.style.setProperty('display','block','important');
    pR.style.setProperty('display','block','important');
    pL.style.setProperty('flex','1 1 0','important');
    pR.style.setProperty('flex','1 1 0','important');
    pL.style.setProperty('min-width','0','important');
    pR.style.setProperty('min-width','0','important');
    pL.style.order='1'; pR.style.order='3';
    wrapEl2.classList.add('split');
    // cria divisor se não existe
    if(!document.getElementById('splitDivider')){
      const div=document.createElement('div');
      div.id='splitDivider'; div.className='split-divider';
      div.innerHTML='';
      // garante ordem visual left -> divider -> right independente da ordem no DOM
      pL.style.order='1'; div.style.order='2'; pR.style.order='3';
      // coloca divider entre os dois no DOM para flex order funcionar
      // remove e reinsere na ordem correta
      wrapEl2.appendChild(div);
      // força reflow para garantir que ambos apareçam
      void wrapEl2.offsetHeight;
      // drag só com mouse pressionado - evita seleção de texto
      let dragging=false;
      const isMobileSplit=()=> window.innerWidth<=768;
      const startDrag=e=>{
        dragging=true; div.classList.add('dragging');
        document.body.style.userSelect='none';
        document.body.style.webkitUserSelect='none';
        document.body.style.cursor=isMobileSplit()?'row-resize':'col-resize';
        document.querySelectorAll('.pane iframe').forEach(f=> f.style.pointerEvents='none');
        if(e.cancelable){ e.preventDefault(); e.stopPropagation(); }
      };
      const stopDrag=()=>{
        dragging=false; div.classList.remove('dragging');
        document.body.style.userSelect='';
        document.body.style.webkitUserSelect='';
        document.body.style.cursor='';
        document.querySelectorAll('.pane iframe').forEach(f=> f.style.pointerEvents='');
      };
      div.addEventListener('mousedown', startDrag);
      div.addEventListener('touchstart', startDrag, {passive:false});
      window.addEventListener('mouseup', stopDrag);
      window.addEventListener('touchend', stopDrag);
      window.addEventListener('touchcancel', stopDrag);
      window.addEventListener('mousemove',e=>{
        if(!dragging) return;
        e.preventDefault();
        if(isMobileSplit()){
          const rect=wrapEl2.getBoundingClientRect();
          const pct=((e.clientY-rect.top)/rect.height)*100;
          if(pct<22||pct>78) return;
          pL.style.setProperty('flex',`0 0 ${pct}%`,'important');
          pR.style.setProperty('flex',`0 0 ${100-pct}%`,'important');
        } else {
          const rect=wrapEl2.getBoundingClientRect();
          const pct=((e.clientX-rect.left)/rect.width)*100;
          if(pct<22||pct>78) return;
          pL.style.setProperty('flex',`0 0 ${pct}%`,'important');
          pR.style.setProperty('flex',`0 0 ${100-pct}%`,'important');
        }
      });
      window.addEventListener('touchmove',e=>{
        if(!dragging) return;
        if(isMobileSplit()){
          const rect=wrapEl2.getBoundingClientRect();
          const pct=((e.touches[0].clientY-rect.top)/rect.height)*100;
          if(pct<22||pct>78) return;
          pL.style.setProperty('flex',`0 0 ${pct}%`,'important');
          pR.style.setProperty('flex',`0 0 ${100-pct}%`,'important');
        } else {
          const rect=wrapEl2.getBoundingClientRect();
          const pct=((e.touches[0].clientX-rect.left)/rect.width)*100;
          if(pct<22||pct>78) return;
          pL.style.setProperty('flex',`0 0 ${pct}%`,'important');
          pR.style.setProperty('flex',`0 0 ${100-pct}%`,'important');
        }
        if(e.cancelable) e.preventDefault();
      },{passive:false});
    }
    history.replaceState(null,'',`#${leftId}+${rightId}`);
  }
  function exitSplit(){
    // guarda a aba que estava aberta antes da divisão (ESQ)
    const keepId = splitLeft || document.querySelector('.tab.active')?.dataset.pane || document.querySelector('.pane.active')?.id || null;
    splitSelecting=false; splitLeft=null; splitRight=null; ctxTarget=null;
    hideCtx();
    tabs.forEach(t=> t.classList.remove('split-pick','split-left','split-right'));
    wrapEl2.classList.remove('split');
    document.querySelectorAll('.pane').forEach(p=>{ p.classList.remove('split-active'); p.style.removeProperty('display'); p.style.removeProperty('flex'); p.style.removeProperty('order'); });
    const d=document.getElementById('splitDivider'); if(d) d.remove();
    // volta na aba que estava aberta antes de dividir
    const curId = keepId || (tabs[0] && tabs[0].dataset.pane);
    const curTab = document.querySelector(`.tab[data-pane="${curId}"]`) || tabs[0];
    if(curTab){
      tabs.forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
      curTab.classList.add('active');
      const el=document.getElementById(curTab.dataset.pane);
      if(el) el.classList.add('active');
      centerActiveTab(curTab);
      history.replaceState(null,'','#'+curTab.dataset.pane);
    }
  }
  function showCtx(x,y,forTab){
    ctxTarget=forTab;
    const isSplit=wrapEl2.classList.contains('split');
    ctxCloseSplit.style.display=isSplit?'flex':'none';
    ctxSep.style.display=isSplit?'block':'none';
    ctxSplit.textContent= isSplit ? '⇄ Trocar esta aba no split' : '⊞ Dividir com esta aba';
    // posiciona
    ctxMenu.style.left=Math.min(x, window.innerWidth-230)+'px';
    ctxMenu.style.top=Math.min(y, window.innerHeight-120)+'px';
    ctxMenu.classList.add('show');
  }
  function hideCtx(){ ctxMenu.classList.remove('show'); }
  // clique direito na aba
  tabs.forEach(t=>{
    t.addEventListener('contextmenu',e=>{
      e.preventDefault();
      showCtx(e.clientX, e.clientY, t.dataset.pane);
    });
    // long-press no celular (500ms)
    let pressTimer=null;
    t.addEventListener('touchstart',e=>{
      pressTimer=setTimeout(()=>{
        const touch=e.touches[0];
        showCtx(touch.clientX, touch.clientY, t.dataset.pane);
      }, 500);
    },{passive:true});
    t.addEventListener('touchend',()=> clearTimeout(pressTimer));
    t.addEventListener('touchmove',()=> clearTimeout(pressTimer));
  });
  ctxSplit.addEventListener('click',()=>{
    if(wrapEl2.classList.contains('split')){
      const newId=ctxTarget;
      if(newId===splitLeft || newId===splitRight){ hideCtx(); return; }
      document.querySelectorAll('.pane.split-active').forEach(p=>{
        if(p.id!==splitLeft){
          p.classList.remove('split-active');
          p.style.removeProperty('display'); p.style.removeProperty('flex'); p.style.removeProperty('order');
        }
      });
      splitRight=newId;
      const pr=document.getElementById(newId);
      if(pr){
        pr.classList.add('split-active');
        pr.style.setProperty('display','block','important');
        pr.style.setProperty('flex','1 1 0','important');
        pr.style.setProperty('min-width','0','important');
        pr.style.order='3';
      }
      tabs.forEach(x=>x.classList.remove('split-right'));
      document.querySelector(`.tab[data-pane="${splitRight}"]`)?.classList.add('split-right');
      history.replaceState(null,'',`#${splitLeft}+${splitRight}`);
      hideCtx();
      return;
    }
    if(!ctxTarget) return;
    const curActive = document.querySelector('.tab.active')?.dataset.pane || document.querySelector('.pane.active')?.id || splitLeft;
    // esquerda é a que estava aberta antes de dividir, direita é a clicada
    if(curActive && curActive !== ctxTarget){
      enterSplit(curActive, ctxTarget);
    } else {
      enterSplitSelect(ctxTarget);
      document.querySelector(`.tab[data-pane="${ctxTarget}"]`)?.classList.add('split-left');
    }
    hideCtx();
  });
  ctxCloseSplit.addEventListener('click',()=>{ hideCtx(); exitSplit(); });
  document.addEventListener('click',e=>{ if(!ctxMenu.contains(e.target)) hideCtx(); });
  // ESC sai do split
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(ctxMenu.classList.contains('show')){ e.preventDefault(); hideCtx(); return; }
      if(wrapEl2.classList.contains('split')||splitSelecting){ e.preventDefault(); exitSplit(); }
    }
  });

  tabs.forEach(t=>{
    t.addEventListener('click',()=>{
      // modo escolha do split (após clique direito)
      if(splitSelecting){
        const id=t.dataset.pane;
        if(!splitLeft){
          splitLeft=id;
          updateSplitPickUI();
          return;
        } else if(!splitRight && id!==splitLeft){
          splitRight=id;
          enterSplit(splitLeft,splitRight);
          return;
        } else if(id===splitLeft){
          splitLeft=null; updateSplitPickUI(); return;
        }
        return;
      }
      // em split: esquerda FIXA na primeira (p-admin), só a direita troca - max 2
      if(wrapEl2.classList.contains('split')){
        const newId=t.dataset.pane;
        if(newId===splitLeft) return;
        document.querySelectorAll('.pane.split-active').forEach(p=>{
          if(p.id!==splitLeft){
            p.classList.remove('split-active');
            p.style.removeProperty('display'); p.style.removeProperty('flex'); p.style.removeProperty('order');
          }
        });
        splitRight=newId;
        const p=document.getElementById(newId);
        if(p){
          p.classList.add('split-active');
          p.style.setProperty('display','block','important');
          p.style.setProperty('flex','1 1 0','important');
          p.style.setProperty('min-width','0','important');
          p.style.order='3';
        }
        tabs.forEach(x=>x.classList.remove('split-right'));
        document.querySelector(`.tab[data-pane="${splitRight}"]`)?.classList.add('split-right');
        // garante esquerda
        document.querySelector(`.tab[data-pane="${splitLeft}"]`)?.classList.add('split-left');
        history.replaceState(null,'',`#${splitLeft}+${splitRight}`);
        return;
      }
      tabs.forEach(x=>x.classList.remove('active'));
      panes.forEach(p=>p.classList.remove('active'));
      t.classList.add('active');
      const id=t.dataset.pane;
      const el=document.getElementById(id);
      if(el) el.classList.add('active');
      history.replaceState(null,'','#'+id);
      centerActiveTab(t);
    });
    t.addEventListener('dblclick',()=> reloadPane(t.dataset.pane));
  });
  // SETAS ← → mudam de aba
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA' || e.target.tagName==='SELECT') return;
    if(e.key==='ArrowRight' || e.key==='ArrowLeft'){
      e.preventDefault();
      const a=document.querySelector('.tab.active');
      let i=Array.from(tabs).indexOf(a);
      if(e.key==='ArrowRight') i=(i+1)%tabs.length; else i=(i-1+tabs.length)%tabs.length;
      tabs[i].click(); tabs[i].focus();
    }
  });
  // restaura aba via hash (suporta split com +)
  const h=location.hash.replace('#','');
  if(h){
    if(h.includes('+')){
      const [a,b]=h.split('+');
      if(a&&b && document.getElementById(a) && document.getElementById(b)){
        // espera tabs carregarem
        setTimeout(()=> enterSplit(a,b), 100);
      } else {
        const tt=document.querySelector(`.tab[data-pane="${h}"]`); if(tt) tt.click();
      }
    } else {
      const tt=document.querySelector(`.tab[data-pane="${h}"]`); if(tt) tt.click();
    }
  } else { const a=document.querySelector('.tab.active'); if(a) centerActiveTab(a); }




  // arraste horizontal na nav com mouse + touch (funciona no celular e desktop)
  let isDown=false, startScroll=0, scrollLeft=0;
  if(nav){
    nav.addEventListener('mousedown',e=>{
      isDown=true; nav.style.cursor='grabbing'; startScroll=e.pageX - nav.offsetLeft; scrollLeft=nav.scrollLeft;
    });
    nav.addEventListener('mouseleave',()=>{ isDown=false; nav.style.cursor=''; });
    nav.addEventListener('mouseup',()=>{ isDown=false; nav.style.cursor=''; });
    nav.addEventListener('mousemove',e=>{
      if(!isDown) return;
      e.preventDefault();
      const x=e.pageX - nav.offsetLeft;
      const walk=(x - startScroll)*1.2;
      nav.scrollLeft=scrollLeft - walk;
    });
    // touch para celular - arraste com dedo
    let tStartX=0, tScrollLeft=0;
    nav.addEventListener('touchstart',e=>{
      tStartX=e.touches[0].pageX - nav.offsetLeft;
      tScrollLeft=nav.scrollLeft;
    },{passive:true});
    nav.addEventListener('touchmove',e=>{
      const x=e.touches[0].pageX - nav.offsetLeft;
      const walk=(x - tStartX)*1;
      nav.scrollLeft=tScrollLeft - walk;
    },{passive:true});
    // rolagem com wheel horizontal
    nav.addEventListener('wheel',e=>{
      if(Math.abs(e.deltaX) < Math.abs(e.deltaY) && e.deltaY!==0){
        e.preventDefault();
        nav.scrollLeft += e.deltaY;
      }
    },{passive:false});
  }
</script>
