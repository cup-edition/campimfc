<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;600;700;900&display=swap');

  :root {
    --bg-primary: #05080c;
    --bg-secondary: #0a1219;
    --bg-card: rgba(16, 28, 42, 0.85);
    --bg-card-hover: rgba(24, 42, 62, 0.95);
    --border-color: rgba(56, 156, 255, 0.15);
    --border-glow: rgba(56, 156, 255, 0.3);
    --text-primary: #f0f8ff;
    --text-secondary: #8ab4d6;
    --text-muted: #4a6a7a;
    --accent-1: #00d4ff;
    --accent-2: #7b2ffc;
    --accent-3: #ff6b6b;
    --accent-glow: rgba(0, 212, 255, 0.25);
    --gradient-main: linear-gradient(135deg, #00d4ff 0%, #7b2ffc 50%, #ff6b6b 100%);
    --shadow-card: 0 8px 40px rgba(0, 0, 0, 0.6);
    --shadow-glow: 0 0 60px rgba(0, 212, 255, 0.1);
    --radius: 16px;
    --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 10% 20%, rgba(0, 212, 255, 0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(123, 47, 252, 0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(255, 107, 107, 0.02) 0%, transparent 70%);
    background-attachment: fixed;
    overflow-x: hidden;
  }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg-secondary); }
  ::-webkit-scrollbar-thumb { background: var(--gradient-main); border-radius: 4px; }

  .header {
    background: rgba(10, 18, 25, 0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-color);
    padding: 0 32px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 40px rgba(0, 0, 0, 0.4);
  }
  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 80px;
    gap: 24px;
  }
  .header-logo {
    height: 72px;
    display: flex;
    align-items: center;
    flex: 0 0 auto;
    max-width: 320px;
    margin-left: 6px;
  }
  .header-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 30px var(--accent-glow));
    transition: var(--transition);
  }
  .header-logo img:hover {
    filter: drop-shadow(0 0 50px rgba(0, 212, 255, 0.4));
    transform: scale(1.02);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,230,118,0.08);
    border: 1px solid rgba(0,230,118,0.18);
    border-radius: 20px;
    padding: 5px 14px;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 25px rgba(0,230,118,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
    transition: var(--transition);
    transform: translateX(-6px);
  }
  .header-right:hover {
    background: rgba(0,230,118,0.12);
    box-shadow: 0 0 30px rgba(0,230,118,0.18);
    transform: translateX(-6px) translateY(-1px);
  }
  .header-right.err { background: rgba(255,23,68,0.08); border-color: rgba(255,23,68,0.18); box-shadow: 0 0 25px rgba(255,23,68,0.12); }
  .header-right.offline { background: rgba(255,214,0,0.08); border-color: rgba(255,214,0,0.18); box-shadow: 0 0 25px rgba(255,214,0,0.12); }

  .live-badge {
    background: var(--accent-3);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 20px;
    letter-spacing: 2px;
    animation: pulse-live 1.5s infinite;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
    flex-shrink: 0;
  }
  @keyframes pulse-live {
    0%, 100% { opacity: 1; box-shadow: 0 0 30px rgba(255, 107, 107, 0.3); }
    50% { opacity: 0.7; box-shadow: 0 0 60px rgba(255, 107, 107, 0.1); }
  }

  .header-time {
    font-size: 12px;
    color: var(--text-muted);
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00e676;
    display: inline-block;
    box-shadow: 0 0 12px rgba(0,230,118,0.8);
    position: relative;
    flex-shrink: 0;
  }
  .status-dot::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px solid rgba(0,230,118,0.4);
    animation: ping-dot 1.8s ease-out infinite;
  }
  @keyframes ping-dot {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  .status-dot.ok { background: #00e676; box-shadow: 0 0 12px rgba(0,230,118,0.8); }
  .status-dot.ok::before { border-color: rgba(0,230,118,0.4); }
  .status-dot.err { background: #ff1744; box-shadow: 0 0 12px rgba(255,23,68,0.8); }
  .status-dot.err::before { border-color: rgba(255,23,68,0.4); }
  .status-dot.offline { background: #ffd600; box-shadow: 0 0 12px rgba(255,214,0,0.8); }
  .status-dot.offline::before { border-color: rgba(255,214,0,0.4); }

  .status-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1.8px;
    color: #00e676;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(0,230,118,0.5);
    flex-shrink: 0;
  }
  .status-dot.ok ~ .status-text { color: #00e676; text-shadow: 0 0 10px rgba(0,230,118,0.5); }
  .status-dot.err ~ .status-text { color: #ff6b6b; text-shadow: 0 0 10px rgba(255,23,68,0.5); }
  .status-dot.offline ~ .status-text { color: #ffd600; text-shadow: 0 0 10px rgba(255,214,0,0.5); }

  .main-nav {
    background: rgba(10, 18, 25, 0.8);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-color);
  }
  .main-nav-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    gap: 4px;
    padding: 0 4px;
  }
  .nav-tab {
    padding: 14px 28px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: var(--transition);
    font-family: 'Inter', sans-serif;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    border-bottom: 3px solid transparent;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 8px 8px 0 0;
    position: relative;
  }
  .nav-tab:hover {
    color: var(--text-primary);
    background: rgba(0, 212, 255, 0.03);
  }
  .nav-tab.active {
    color: #fff;
    background: linear-gradient(180deg, rgba(0,212,255,0.14) 0%, rgba(0,212,255,0.04) 100%);
    border-bottom-color: var(--accent-1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), inset 0 -2px 0 var(--accent-1), 0 4px 18px rgba(0,212,255,0.18);
    text-shadow: 0 0 10px rgba(0,212,255,0.5);
    font-weight: 800;
    letter-spacing: 1.1px;
  }
  .nav-tab:not(.active) {
    opacity: 1;
    color: #fff;
  }
  .nav-tab:not(.active):hover {
    opacity: 1;
    background: rgba(255,255,255,0.04);
    color: var(--text-primary);
  }

  .container { max-width: 1280px; margin: 0 auto; padding: 32px 24px; }

  .section { display: none; animation: fadeIn 0.5s ease; }
  .section.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 700;
    background: var(--gradient-main);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border-color), transparent);
  }

  .stat-boxes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat-box {
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 14px 12px;
    text-align: center;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }
  .stat-box::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--gradient-main);
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .stat-box:hover {
    border-color: var(--border-glow);
    transform: translateY(-4px);
    box-shadow: var(--shadow-card), var(--shadow-glow);
  }
  .stat-box-num {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: 900;
    background: var(--gradient-main);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
  }
  .stat-box-label {
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 4px;
    font-weight: 600;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .card {
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow-card);
    transition: var(--transition);
  }
  .card:hover {
    border-color: var(--border-glow);
    transform: translateY(-2px);
    box-shadow: var(--shadow-card), var(--shadow-glow);
  }
  .card-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    background: var(--gradient-main);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }

  .season-pub-card {
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 20px 28px;
    display: flex;
    align-items: center;
    gap: 24px;
    transition: var(--transition);
    box-shadow: var(--shadow-card);
    cursor: pointer;
    margin-bottom: 12px;
  }
  .season-pub-card:hover {
    border-color: var(--border-glow);
    transform: translateX(4px);
    box-shadow: var(--shadow-card), var(--shadow-glow);
  }
  .season-pub-card.active {
    border-color: var(--accent-3);
    box-shadow: 0 0 40px rgba(255, 107, 107, 0.08);
  }
  .season-pub-year {
    font-family: 'Orbitron', sans-serif;
    font-size: 38px;
    font-weight: 900;
    color: var(--accent-1);
    min-width: 80px;
    flex-shrink: 0;
    line-height: 1;
  }
  .season-pub-year.active { color: var(--accent-3); }
  .season-info {
    flex: 1;
  }
  .season-pub-name {
    font-size: 16px;
    font-weight: 700;
  }
  .season-pub-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .season-pub-badge { 
    margin-left: auto;
    flex-shrink: 0;
  }
  .season-pub-expand {
    font-size: 24px;
    color: var(--text-muted);
    transition: var(--transition);
    flex-shrink: 0;
  }
  .season-pub-card:hover .season-pub-expand {
    color: var(--accent-1);
  }

  .edicoes-container {
    margin-top: 12px;
    padding-left: 20px;
    border-left: 2px solid var(--border-color);
    display: none;
  }
  .edicoes-container.open { display: block; }

  .edicao-item {
    background: rgba(5, 8, 12, 0.4);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    transition: var(--transition);
    cursor: pointer;
  }
  .edicao-item:hover {
    border-color: var(--border-glow);
    background: rgba(0, 212, 255, 0.03);
  }
  .edicao-header {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .edicao-num {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    font-weight: 900;
    color: var(--accent-1);
    min-width: 50px;
  }
  .edicao-global {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 600;
    background: rgba(74, 106, 122, 0.15);
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 0.5px;
    border: 1px solid rgba(74, 106, 122, 0.1);
  }
  .edicao-campeao {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #ffd600;
    font-weight: 700;
    font-size: 14px;
  }
  .edicao-artilheiros {
    font-size: 12px;
    color: var(--text-muted);
  }
  .edicao-data {
    font-size: 12px;
    color: var(--text-muted);
    margin-left: auto;
  }
  .edicao-expand {
    font-size: 18px;
    color: var(--text-muted);
    transition: var(--transition);
  }

  .edicao-detalhes-expand {
    margin-top: 14px;
    padding: 20px;
    background: rgba(5, 8, 12, 0.3);
    border-radius: 10px;
    border: 1px solid var(--border-color);
    display: none;
  }
  .edicao-detalhes-expand.open { display: block; }

  .edicao-detalhes-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .detail-card {
    background: rgba(5, 8, 12, 0.4);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .detail-card:last-child { margin-bottom: 0; }
  .detail-card-title {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 700;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 6px;
  }

  .final-match-display {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 8px 0;
    font-size: 18px;
    font-weight: 700;
    flex-wrap: wrap;
  }
  .final-team {
    text-align: center;
    min-width: 80px;
  }
  .final-escudo {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    margin: 0 auto 6px;
    overflow: hidden;
    border: 2px solid var(--border-color);
    background: rgba(5, 8, 12, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .final-escudo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
  .final-escudo .fallback { font-size: 24px; }
  .final-nome { font-size: 14px; font-weight: 600; }
  .final-score {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: var(--accent-1);
  }
  .final-score.gold { color: #ffd600; }

  .table-wrap { overflow-x: auto; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th {
    padding: 8px 12px;
    text-align: left;
    font-size: 9px;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 2px solid var(--border-color);
    background: rgba(5, 8, 12, 0.5);
  }
  tbody td {
    padding: 8px 12px;
    border-bottom: 1px solid rgba(56, 156, 255, 0.05);
    vertical-align: middle;
    font-size: 12px;
  }
  tbody tr:hover { background: rgba(0, 212, 255, 0.03); }
  tbody tr:last-child td { border-bottom: none; }

  .pos-badge-mini {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 12px;
    font-family: 'Orbitron', sans-serif;
  }
  .pos-1-mini { background: linear-gradient(135deg, #ffd600, #f5a623); color: #000; }
  .pos-2-mini { background: linear-gradient(135deg, #b0bec5, #78909c); color: #000; }
  .pos-other-mini { background: var(--border-color); color: var(--text-muted); }

  .artilheiro-mini {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(56, 156, 255, 0.05);
  }
  .artilheiro-mini:last-child { border-bottom: none; }
  .artilheiro-mini .foto-mini {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid #ffd600;
    background: rgba(5, 8, 12, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .artilheiro-mini .foto-mini img { width: 100%; height: 100%; object-fit: cover; }
  .artilheiro-mini .foto-mini .fallback { font-size: 16px; }
  .artilheiro-mini .art-nome { font-weight: 600; flex: 1; font-size: 14px; }
  .artilheiro-mini .art-time { font-size: 11px; color: var(--text-muted); }
  .artilheiro-mini .art-gols {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 900;
    color: var(--accent-1);
  }
  .artilheiro-mini .art-gols.gold { color: #ffd600; }

  .gols-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 400px;
    overflow-y: auto;
  }
  .gol-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    background: rgba(5, 8, 12, 0.2);
    border-radius: 6px;
    font-size: 13px;
    border-left: 3px solid var(--border-color);
  }
  .gol-item.final-gol {
    border-left-color: #ffd600;
    background: rgba(255, 215, 0, 0.05);
  }
  .gol-item .gol-foto {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--border-color);
    background: rgba(5, 8, 12, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .gol-item .gol-foto img { width: 100%; height: 100%; object-fit: cover; }
  .gol-item .gol-foto .fallback { font-size: 14px; }
  .gol-item .gol-nome { font-weight: 600; flex: 1; font-size: 14px; }
  .gol-item .gol-time { font-size: 11px; color: var(--text-muted); }
  .gol-item .gol-fase {
    font-size: 10px;
    color: var(--accent-1);
    font-weight: 700;
    letter-spacing: 1px;
  }
  .gol-item .gol-fase.final-fase { color: #ffd600; }
  .gol-item .gol-qtd {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent-1);
  }
  .gol-item .gol-detalhes {
    font-size: 10px;
    color: var(--text-muted);
  }

  .status-badge {
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    display: inline-block;

    url.searchParams.set('tab', btn.dataset.tab);
    if (replace) {
      window.history.replaceState({ tab: btn.dataset.tab }, '', url);
    } else {
      window.history.pushState({ tab: btn.dataset.tab }, '', url);
    }
  }
  
  if (id === 'dashboard') renderDashboard();
  if (id === 'atual') renderTemporadaAtual();
}

function ordinal(n) {
  var sufixos = ['ª', 'ª', 'ª', 'ª', 'ª', 'ª', 'ª', 'ª', 'ª', 'ª'];
  var v = n % 100;
  return n + (sufixos[(v - 20) % 10] || sufixos[v] || sufixos[0]);
}

function getJogadorNome(id) {

function isPlacarDefinido(valor) {
  return valor !== '-' && valor !== '' && valor !== null && valor !== undefined && !isNaN(parseInt(valor));
}

function contarResultadosJogador(jogadorId, edicoesList) {
  var v = 0, e = 0, d = 0;
  edicoesList.forEach(function(edicao) {
    (edicao.partidas || []).forEach(function(p) {
      if (p.time1Id !== jogadorId && p.time2Id !== jogadorId) return;
      var g1 = parseInt(p.gols1), g2 = parseInt(p.gols2);
      if (isNaN(g1) || isNaN(g2)) return;
      var ehTime1 = p.time1Id === jogadorId;
      var meu = ehTime1 ? g1 : g2;
      var adv = ehTime1 ? g2 : g1;
      if (meu > adv) v++;
      else if (meu < adv) d++;
      else e++;
    });
    var f = edicao.final;
    if (!f || (f.time1Id !== jogadorId && f.time2Id !== jogadorId)) return;
    var ehTime1 = f.time1Id === jogadorId;
    if (f.tevePenalidades) {
      var g1p = f.golsPenalidades1 || 0, g2p = f.golsPenalidades2 || 0;
      var meuP = ehTime1 ? g1p : g2p, advP = ehTime1 ? g2p : g1p;
      if (meuP > advP) v++; else d++;
    } else {
      var g1f = parseInt(f.gols1), g2f = parseInt(f.gols2);
      if (isNaN(g1f) || isNaN(g2f)) return;
      var meuF = ehTime1 ? g1f : g2f, advF = ehTime1 ? g2f : g1f;
      if (meuF > advF) v++;
      else if (meuF < advF) d++;
      else e++;
    }
  });
  return { v: v, e: e, d: d };
}

function contarGolsSofridos(jogadorId, edicoesList) {
  var sofridos = 0;
  edicoesList.forEach(function(edicao) {
    (edicao.partidas || []).forEach(function(p) {
      if (p.time1Id !== jogadorId && p.time2Id !== jogadorId) return;
      var g1 = parseInt(p.gols1), g2 = parseInt(p.gols2);
      if (isNaN(g1) || isNaN(g2)) return;
      var ehTime1 = p.time1Id === jogadorId;
      sofridos += ehTime1 ? g2 : g1;
    });
    var f = edicao.final;
    if (f && (f.time1Id === jogadorId || f.time2Id === jogadorId)) {
      var ehTime1 = f.time1Id === jogadorId;
      var g1 = parseInt(f.gols1), g2 = parseInt(f.gols2);
      if (f.tevePenalidades) {
        g1 = f.golsPenalidades1 || 0;
        g2 = f.golsPenalidades2 || 0;
      }
      if (!isNaN(g1) && !isNaN(g2)) {
        sofridos += ehTime1 ? g2 : g1;
      }
    }
  });
  return sofridos;
}

    var jogadorEdicao = edicao.jogadores && edicao.jogadores.find ? edicao.jogadores.find(function(j) { return j.id === jogadorId; }) : null;
    if (jogadorEdicao) {
      edicoes++;
      gols += jogadorEdicao.gols || 0;
      partidas += jogadorEdicao.partidasJogadas || 0;
    }
    if (edicao.campeao && edicao.campeao.timeId === jogadorId) titulos++;
    if (edicao.vice && edicao.vice.timeId === jogadorId) vices++;
    if (edicao.artilheiros && Array.isArray(edicao.artilheiros) && edicao.artilheiros.some(function(a) { return a.jogadorId === jogadorId; })) artilharias++;

      var ehTime1 = p.time1Id === jogadorId;
      var advId = ehTime1 ? p.time2Id : p.time1Id;

      var adv = ehTime1 ? g2 : g1;

      var c = confronto[advId];

window.visualizarEdicao = function(edicaoId) {
  const edicao = state.edicoes.find(e => e.id === edicaoId);
  if (!edicao) return;

  const numeroLocal = edicao.numeroTemporada || edicao.numero || 1;
  const numeroGlobal = edicao.numero || 0;

  const dataArquivo = (edicao.dataEdicao || '').replace(/\//g, '-');
  const nomeArquivoEdicao = 'EDIÇÃO ' + numeroLocal + 'º (GLOBAL #' + numeroGlobal + ') ' + dataArquivo + ' (' + (edicao.temporadaNome || '') + ').png';

  const timesComEscudos = (edicao.times || []).map(t => ({
    ...t,
    escudo: getJogador(t.id)?.foto || '🧑'
  }));

  const time1Final = timesComEscudos.find(t => t.id === edicao.final?.time1Id);
  const time2Final = timesComEscudos.find(t => t.id === edicao.final?.time2Id);

  function getPlayerAvatar(jogadorId) {
    const jogador = state.jogadores.find(j => j.id === jogadorId);
    if (jogador?.foto && (jogador.foto.startsWith('http') || jogador.foto.startsWith('data:'))) {
      return `<img src="${jogador.foto}" style="width:100%;height:100%;object-fit:cover;">`;
    }
    return `<span style="font-size:14px;">🧑</span>`;
  }

  function getJogadorNome(jogadorId) {
    const j = state.jogadores.find(j => j.id === jogadorId);
    return j ? j.nome : 'Desconhecido';
  }

  let maiorGols = 0;
  if (edicao.jogadores && Array.isArray(edicao.jogadores)) {
    edicao.jogadores.forEach(j => {
      if ((j.gols || 0) > maiorGols) {
        maiorGols = j.gols || 0;
      }
    });
  }

  const jogadoresTime1Final = [];
  const jogadoresTime2Final = [];

  if (edicao.jogadores && Array.isArray(edicao.jogadores)) {
    const time1Id = edicao.final?.time1Id;
    const time2Id = edicao.final?.time2Id;

    edicao.jogadores.forEach(j => {
      if (j.timeId === time1Id) {
        jogadoresTime1Final.push({
          id: j.id,
          nome: getJogadorNome(j.id),
          gols: j.gols || 0
        });
      } else if (j.timeId === time2Id) {
        jogadoresTime2Final.push({
          id: j.id,
          nome: getJogadorNome(j.id),
          gols: j.gols || 0
        });
      }
    });
  }

  jogadoresTime1Final.sort((a, b) => b.gols - a.gols);
  jogadoresTime2Final.sort((a, b) => b.gols - a.gols);

  function renderJogadoresAgrupados() {
    if (!edicao.jogadores || edicao.jogadores.length === 0) {
      return '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:12px;width:100%;">Nenhum jogador registrado nesta edição</div>';
    }

    const lista = edicao.jogadores.slice().sort((a, b) => (b.gols || 0) - (a.gols || 0));

    return lista.map(j => {
      const isMaiorGol = j.gols > 0 && j.gols === maiorGols;
      return `
        <div style="display:flex;align-items:center;gap:8px;padding:4px 10px;background:${isMaiorGol ? 'rgba(255,215,0,0.08)' : 'rgba(5,8,12,0.2)'};border-radius:6px;margin:2px;border:${isMaiorGol ? '1px solid rgba(255,215,0,0.15)' : '1px solid var(--border-color)'};min-width:200px;flex:1;">
          <div style="width:24px;height:24px;border-radius:50%;overflow:hidden;border:1px solid var(--border-color);background:rgba(5,8,12,0.5);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            ${getPlayerAvatar(j.id)}
          </div>
          <span style="font-weight:${isMaiorGol ? '700' : '500'};flex:1;font-size:13px;color:${isMaiorGol ? '#ffd600' : 'var(--text-primary)'};">${getJogadorNome(j.id)}</span>
          <span style="font-size:11px;color:${isMaiorGol ? '#ffd600' : 'var(--accent-1)'};font-weight:600;">${j.gols || 0}⚽</span>
          ${isMaiorGol ? '<span style="font-size:11px;">🎯</span>' : ''}
        </div>
      `;
    }).join('');
  }

  function renderPlacaresFaseGrupos() {
    if (!edicao.partidas || edicao.partidas.length === 0) {
      return '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:12px;">Nenhuma partida registrada</div>';
    }

    const _colsP = 2; const _rowsP = Math.ceil(edicao.partidas.length/_colsP); const _partidasOrdenadas = []; for(let r=0;r<_rowsP;r++) for(let c=0;c<_colsP;c++){const idx=c*_rowsP+r; if(idx<edicao.partidas.length) _partidasOrdenadas.push(edicao.partidas[idx]);}
    return _partidasOrdenadas.map(p => {

      const escudo2 = getJogador(p.time2Id)?.foto || '🧑';

      const nome2 = getJogadorNome(p.time2Id) || p.time2Nome || '?';

          <div style="display:flex;align-items:center;gap:8px;flex:1;">
            <div style="width:24px;height:24px;border-radius:50%;overflow:hidden;border:1px solid var(--border-color);background:rgba(5,8,12,0.5);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              ${escudo1 && (escudo1.startsWith('http') || escudo1.startsWith('data:')) 
                ? `<img src="${escudo1}" style="width:100%;height:100%;object-fit:contain;padding:2px;">` 
                : `<span style="font-size:12px;">${escudo1 || '🧑'}</span>`}
            </div>
            <span style="font-size:13px;font-weight:500;">${nome1}</span>
          </div>
          <div style="font-family:'Orbitron',sans-serif;font-size:16px;font-weight:700;color:var(--accent-1);padding:0 12px;">
            ${p.gols1 || 0} × ${p.gols2 || 0}
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;">
            <span style="font-size:13px;font-weight:500;">${nome2}</span>
            <div style="width:24px;height:24px;border-radius:50%;overflow:hidden;border:1px solid var(--border-color);background:rgba(5,8,12,0.5);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              ${escudo2 && (escudo2.startsWith('http') || escudo2.startsWith('data:'))

                : `<span style="font-size:12px;">${escudo2 || '🧑'}</span>`}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  const tevePenalidades = edicao.final?.tevePenalidades || false;

  if (tevePenalidades && edicao.final) {

    if (edicao.final.penalties?.winner) {
      penaltyInfo += `<div style="font-size:13px;color:#ffd600;font-weight:700;">🏆 Vencedor nos pênaltis: ${edicao.final.penalties.winner}</div>`;

          ${edicao.jogadores?.length ? `• 👤 ${edicao.jogadores.length} jogadores` : ''}

window.baixarImagemEdicao = function(containerId, nomeArquivo) {
  var container = document.getElementById(containerId);
  if (!container) return;
  if (typeof html2canvas === 'undefined') {
    alert('Biblioteca de imagem não carregou. Verifique a conexão.');
    return;
  }
  var btn = document.getElementById('btn-baixar-edicao');
  var fechar = document.getElementById('btn-fechar-modal-edicao');
  var ocultos = [];
  [btn, fechar].forEach(function(el) {
    if (el) { ocultos.push([el, el.style.display]); el.style.display = 'none'; }
  });

  if (!nomeArquivo) nomeArquivo = 'edicao-' + new Date().toISOString().slice(0, 10) + '.png';

  html2canvas(container, {
    useCORS: true,
    scale: 2,
    backgroundColor: '#0a1219',
    onclone: function(doc) {
      var raiz = doc.getElementById(containerId);
      var nodes = raiz ? [raiz].concat(Array.prototype.slice.call(raiz.querySelectorAll('*'))) : [];
      nodes.forEach(function(n) {
        n.style.maxHeight = 'none';
        n.style.overflow = 'visible';
      });
      if (raiz) {
        var logoPes = raiz.querySelector('img[alt="CUP EDITION PES"]');
        if (logoPes) {
          logoPes.style.height = '90px';
          logoPes.style.width = 'auto';
          logoPes.style.borderRadius = '0';
          logoPes.style.filter = 'drop-shadow(0 0 30px rgba(0, 212, 255, 0.3))';
          var logoPai = logoPes.parentNode;
          if (logoPai) {
            logoPai.style.position = 'absolute';
            logoPai.style.top = '12px';
            logoPai.style.right = '12px';
            logoPai.style.float = 'none';
            logoPai.style.margin = '0';
            logoPai.style.alignItems = 'flex-start';
            logoPai.style.zIndex = '100';
          }
        }
        raiz.querySelectorAll('img').forEach(function(img) {
          var inline = img.getAttribute('style') || '';
          var ehEscudo = inline.indexOf('object-fit:contain') !== -1;
          if (!ehEscudo && img !== logoPes) {
            img.style.borderRadius = '50%';
          }
        });
      }
    }
  }).then(function(canvas) {
    ocultos.forEach(function(p) { p[0].style.display = p[1]; });
    canvas.toBlob(function(blob) {
      if (!blob) { alert('Falha ao gerar a imagem'); return; }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = nomeArquivo;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function() { URL.revokeObjectURL(url); }, 1500);
    }, 'image/png');
  }).catch(function(err) {
    ocultos.forEach(function(p) { p[0].style.display = p[1]; });
    console.error('Erro ao gerar imagem:', err);
    alert('Não foi possível gerar a imagem.');
  });
};

    <div class="card" style="margin-top:16px;">
      <div class="card-title">👤 Estatísticas dos Jogadores (Temporada)</div>
      ${edicoesDaTemp.length > 0 ? (function() {
        var jogadoresDaTemp = {};
        edicoesDaTemp.forEach(function(edicao) {
          if (edicao.jogadores && Array.isArray(edicao.jogadores)) {
            edicao.jogadores.forEach(function(j) {
              if (!jogadoresDaTemp[j.id]) {
                jogadoresDaTemp[j.id] = {
                  id: j.id,
                  nome: getJogadorNome(j.id),
                  foto: getJogadorFoto(j.id),
                  gols: 0,
                  partidas: 0,
                  titulos: 0,
                  vices: 0,
                  artilharias: 0,
                  edicoes: 0
                };
              }
              jogadoresDaTemp[j.id].gols += j.gols || 0;
              jogadoresDaTemp[j.id].partidas += j.partidasJogadas || 0;
              jogadoresDaTemp[j.id].edicoes += 1;
              if ((edicao.campeao || {}).timeId === j.timeId) jogadoresDaTemp[j.id].titulos++;
              if ((edicao.vice || {}).timeId === j.timeId) jogadoresDaTemp[j.id].vices++;
              if (edicao.artilheiros && Array.isArray(edicao.artilheiros)) {
                if (edicao.artilheiros.some(function(a) { return a.jogadorId === j.id; })) jogadoresDaTemp[j.id].artilharias++;
              }
            });
          }
        });

          return j.gols > 0 || j.titulos > 0 || j.vices > 0 || j.artilharias > 0 || j.partidas > 0 || j.edicoes > 0;

          if (b.gols !== a.gols) return b.gols - a.gols;
          if (b.artilharias !== a.artilharias) return b.artilharias - a.artilharias;
          if (b.edicoes !== a.edicoes) return b.edicoes - a.edicoes;
          return a.nome.localeCompare(b.nome);
        });

        }
      })() : '<div style="color:var(--text-muted);text-align:center;padding:12px 0;">Nenhuma edição para exibir</div>'}
    </div>
  `;

  el.innerHTML = html;
}

        edicoesHtml += '  box-shadow: 0 0 20px rgba(255, 107, 107, 0.2);';
        edicoesHtml += '}';
        edicoesHtml += '.edicao-item .artilheiros-hover {';
        edicoesHtml += '  transition: all 0.3s ease;';
        edicoesHtml += '}';
        edicoesHtml += '.edicao-item:hover .artilheiros-hover {';
        edicoesHtml += '  transform: translateX(4px);';
        edicoesHtml += '}';
        edicoesHtml += '.edicao-item .global-badge-hover {';
        edicoesHtml += '  transition: all 0.3s ease;';
        edicoesHtml += '}';
        edicoesHtml += '.edicao-item:hover .global-badge-hover {';
        edicoesHtml += '  border-color: var(--accent-1) !important;';
        edicoesHtml += '  color: var(--accent-1) !important;';
        edicoesHtml += '}';
        edicoesHtml += '</style>';
        
        edicoesHtml += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">';
        
        edicoesHtml += '<span style="font-family:\'Orbitron\',sans-serif;font-size:20px;font-weight:900;color:var(--accent-1);line-height:1.2;flex-shrink:0;">' + ordinal(numeroLocal) + '</span>';
        
        if (time1Final && time2Final) {
          var isTime1Campeao = time1Final.id === e.campeao?.timeId;
          
          edicoesHtml += '<div style="display:flex;align-items:center;gap:4px;">';
          edicoesHtml += '<div style="width:24px;height:24px;border-radius:50%;overflow:hidden;border:2px solid ' + (isTime1Campeao ? '#ffd600' : 'var(--border-color)') + ';background:rgba(5,8,12,0.5);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.3s ease;">';
          if (time1Final.foto && (time1Final.foto.startsWith('http') || time1Final.foto.startsWith('data:'))) {
            edicoesHtml += '<img src="'+time1Final.foto+'" style="width:100%;height:100%;object-fit:cover;padding:0;">';
          } else {
            edicoesHtml += '<span style="font-size:14px;">'+(time1Final.foto || '🧑')+'</span>';
          }
          edicoesHtml += '</div>';
          edicoesHtml += '<span class="campeao-nome-hover" style="font-weight:' + (isTime1Campeao ? '700' : '600') + ';font-size:15px;color:' + (isTime1Campeao ? '#ffd600' : 'var(--text-secondary)') + ';transition:all 0.3s ease;">' + nomeTime1 + '</span>';
          edicoesHtml += '</div>';

          edicoesHtml += '<span class="placar-gols-hover" style="font-family:\'Orbitron\',sans-serif;font-weight:700;color:var(--accent-1);font-size:14px;transition:all 0.3s ease;">' + gols1 + ' × ' + gols2 + '</span>';

          var isTime2Campeao = time2Final.id === e.campeao?.timeId;
          edicoesHtml += '<div style="display:flex;align-items:center;gap:4px;">';
          edicoesHtml += '<div style="width:24px;height:24px;border-radius:50%;overflow:hidden;border:2px solid ' + (isTime2Campeao ? '#ffd600' : 'var(--border-color)') + ';background:rgba(5,8,12,0.5);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.3s ease;">';
          if (time2Final.foto && (time2Final.foto.startsWith('http') || time2Final.foto.startsWith('data:'))) {
            edicoesHtml += '<img src="'+time2Final.foto+'" style="width:100%;height:100%;object-fit:cover;padding:0;">';
          } else {
            edicoesHtml += '<span style="font-size:14px;">'+(time2Final.foto || '🧑')+'</span>';
          }
          edicoesHtml += '</div>';
          edicoesHtml += '<span class="campeao-nome-hover" style="font-weight:' + (isTime2Campeao ? '700' : '600') + ';font-size:15px;color:' + (isTime2Campeao ? '#ffd600' : 'var(--text-secondary)') + ';transition:all 0.3s ease;">' + nomeTime2 + '</span>';
          edicoesHtml += '</div>';
        }

        if (tevePenalidades) {
          edicoesHtml += '<span class="penalty-badge-hover" style="font-size:10px;color:#ff6b6b;font-weight:700;background:rgba(255,107,107,0.08);padding:2px 10px;border-radius:12px;border:1px solid rgba(255,107,107,0.15);transition:all 0.3s ease;">⚽ PÊNALTIS ' + golsP1 + '×' + golsP2 + '</span>';
        }

        edicoesHtml += '<span style="margin-left:auto;display:flex;align-items:center;gap:12px;">';
        
        if (artStr !== '—') {
          edicoesHtml += '<span class="artilheiros-hover" style="font-size:11px;color:var(--accent-1);font-weight:500;transition:all 0.3s ease;">🎯 ' + artStr + '</span>';
        }

        if (e.dataEdicao) {
          edicoesHtml += '<span style="font-size:12px;color:var(--text-muted);font-weight:500;">📅 ' + e.dataEdicao + '</span>';
        }

        edicoesHtml += '<span style="background:rgba(0,212,255,0.15);color:var(--accent-1);border:1px solid rgba(0,212,255,0.25);padding:2px 14px;border-radius:16px;font-weight:700;font-size:14px;font-family:\'Orbitron\',sans-serif;flex-shrink:0;transition:all 0.3s ease;box-shadow:0 0 20px rgba(0,212,255,0.05);">#' + numeroGlobal + '</span>';

        edicoesHtml += '</span>';

        edicoesHtml += '</div>';

        edicoesHtml += '</div>';
      });
      edicoesHtml += '</div>';
    } else {
      edicoesHtml = '<div class="edicoes-container" style="display:none;padding:12px 20px;color:var(--text-muted);font-size:13px;">Nenhuma edição finalizada para esta temporada</div>';
    }

    var statusColor = '#00e676';
    if (t.status === 'encerrado') {
      statusColor = '#ff6b6b';
    }

    html += '<div class="season-pub-card '+(isActive?'active':'')+'" onclick="toggleEdicoes(\''+t.id+'\')" style="margin-bottom:8px;cursor:pointer;">' +
      '<div class="season-pub-year '+(isActive?'active':'')+'">'+t.ano+'</div>' +
      '<div class="season-info">' +
        '<div class="season-pub-name">'+t.nome+'</div>' +
        '<div class="season-pub-desc">'+(t.descricao||'')+'</div>' +
        '<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">📋 '+edicoes.length+' edição(ões)</div>' +
      '</div>' +
      '<div class="season-pub-badge"><span style="padding:3px 12px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:'+statusColor+'20;color:'+statusColor+';border:1px solid '+statusColor+'40;">'+(statusLabel[(t.status === 'planejado') ? 'em_andamento' : t.status]||'Em Andamento')+'</span></div>' +
      '<span class="season-pub-expand" id="season-expand-'+t.id+'">'+(edicoes.length ? '▶' : '—')+'</span>' +
    '</div>' + edicoesHtml;
  });

  el.innerHTML = html;
}

function toggleEdicoes(tempId) {
  var container = document.getElementById('edicoes-'+tempId);
  var expand = document.getElementById('season-expand-'+tempId);
  if (!container) return;
  var isOpen = container.style.display !== 'none';
  container.style.display = isOpen ? 'none' : 'block';
  if (expand) expand.textContent = isOpen ? '▶' : '▼';
}

// ============================================================
// FIREBASE LISTENERS
// ============================================================

function setupFirestoreListeners() {
  setServerStatus('Conectando...', 'offline');
  var collections = ['jogadores', 'partidas', 'temporadas', 'edicoes'];
  var loaded = 0;

  collections.forEach(function(col) {
    db.collection(col).onSnapshot(function(snapshot) {
      var items = [];
      snapshot.forEach(function(doc) {
        var data = doc.data();
        data.id = doc.id;
        items.push(data);
      });
      state[col] = items;
      loaded++;
      if (loaded >= collections.length && !serverReady) {
        serverReady = true;
        setServerStatus('SERVIDOR ONLINE', 'ok');
      }
      if (loaded >= collections.length) {
        renderDashboard();
        renderTemporadaAtual();
        renderTemporadas();
        
        if (isFirstLoad) {
          isFirstLoad = false;
          restoreTabFromUrl();
        }
      }
    }, function(error) {
      console.error('Firestore error on', col, ':', error);
      setServerStatus('ERRO SERVIDOR', 'err');
      loaded++;
      if (loaded >= collections.length) {
        renderDashboard();
        renderTemporadaAtual();
        renderTemporadas();
        
        if (isFirstLoad) {
          isFirstLoad = false;
          restoreTabFromUrl();
        }
      }
    });
  });
  setTimeout(function(){ if(!serverReady) setServerStatus('SERVIDOR OFFLINE','offline'); }, 8000);
}

setupFirestoreListeners();

function restoreTabFromUrl() {
  var params = getUrlParams();
  var tab = params.tab || 'atual';
  
  // Mapear data-tab para section ID correto
  var tabMap = {
    'ATUAL': 'atual',
    'CARREIRAS': 'dashboard',
    'TEMPORADAS': 'temporadas'
  };
  var sectionId = tabMap[tab] || 'atual';
  
  var btn = document.querySelector('.nav-tab[data-tab="' + tab + '"]');
  if (btn) {
    showSection(sectionId, btn, true); // true = replaceState (não adiciona ao histórico)
  } else {
    var defaultBtn = document.querySelector('.nav-tab[data-tab="atual"]');
    if (defaultBtn) showSection('atual', defaultBtn, true);
  }
}

setTimeout(function() {
  renderDashboard();
  renderTemporadaAtual();
  renderTemporadas();
  if (isFirstLoad) {
    isFirstLoad = false;
    restoreTabFromUrl();
  }
}, 3000);
</script>
